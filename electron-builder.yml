appId: io.kabanos.desktop
productName: kabanos
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: brand
    to: brand
    filter: ['*.png']
asarUnpack:
  - '**/*.node'
mac:
  category: public.app-category.developer-tools
  # Separate Apple silicon / Intel DMGs (a universal build trips over native-module prebuilds).
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signature ("-"): free, and required — an unsigned or half-signed app downloaded from the web
  # is reported as "damaged" on Apple silicon. Users still approve it once (Privacy & Security → Open Anyway).
  # With an Apple Developer ID: set `identity` to it and `notarize: true`
  # (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID in the environment) and the prompt goes away.
  identity: '-'
  # Hardened runtime is only needed for notarization (Developer ID); with an ad-hoc signature it can block launch.
  hardenedRuntime: false
dmg:
  # Stable names: the website links to releases/latest/download/kabanos-mac-<arch>.dmg
  artifactName: kabanos-mac-${arch}.${ext}
# No update server yet; add a `publish` provider (e.g. S3 / GitHub) to enable electron-updater.
publish: null
